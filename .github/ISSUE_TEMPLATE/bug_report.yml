name: Bug report
description: Report incorrect behavior in the miniplayer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce on Windows with the Spotify desktop app.
  - type: input
    id: version
    attributes:
      label: App version
      description: Release tag or commit (e.g. v1.2.0), or "run from source".
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a track in Spotify
        2. Launch LyricsMiniplayer.exe
        3. …
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Screenshots, track examples, DPI scaling, or relevant settings.
    validations:
      required: false
