name: Feature request
description: Suggest an improvement for the miniplayer
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the README non-goals first (no macOS/Linux, no Spotify Web API, no playback controls, no auto-updater) before requesting those.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working in the floating miniplayer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds.
    validations:
      required: false
